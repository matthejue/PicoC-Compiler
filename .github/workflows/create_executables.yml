name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-22.04
            platform: linux
            architecture: x64
            archive: picoc-compiler-linux-x86_64.tar.gz
          - name: Windows x86-64
            runner: windows-2022
            platform: windows
            architecture: x64
            archive: picoc-compiler-windows-x86_64.zip
          - name: macOS 11+ x86-64
            runner: macos-15-intel
            platform: macos
            architecture: x64
            archive: picoc-compiler-macos-x86_64.tar.gz
          - name: macOS 11+ arm64
            runner: macos-15
            platform: macos
            architecture: arm64
            archive: picoc-compiler-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install Windows C compiler
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Build Windows Tree-sitter libraries
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          windows_python="$(cygpath --unix "$pythonLocation")/python.exe"
          test -x "$windows_python"
          gcc --version
          CC=gcc "$windows_python" scripts/build_tree_sitter.py

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m compileall -q source
          python -m PyInstaller --clean --noconfirm --distpath=binary --workpath=binary/build source/main.spec
          python scripts/smoke_test.py binary\picoc_compiler.exe
          Compress-Archive -Path binary\picoc_compiler.exe -DestinationPath "binary\${{ matrix.archive }}"

      - name: Build Unix executable
        if: matrix.platform != 'windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos' && '11.0' || '' }}
        run: |
          make package PYTHON=python
          python scripts/smoke_test.py binary/picoc_compiler
          tar -C binary -czf "$GITHUB_WORKSPACE/binary/${{ matrix.archive }}" picoc_compiler

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: binary/${{ matrix.archive }}
          if-no-files-found: error

  android:
    name: Android 7+ arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify preinstalled Android NDK
        run: |
          test -n "$ANDROID_NDK_HOME"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -f .github/release/android/picoc_compiler.c

      - name: Download pinned Android build inputs
        run: |
          mkdir -p binary/downloads
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.14.6/python-3.14.6-aarch64-linux-android.tar.gz \
            --output binary/downloads/python-3.14.6-aarch64-linux-android.tar.gz
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.14.6/python-3.14.6-x86_64-linux-android.tar.gz \
            --output binary/downloads/python-3.14.6-x86_64-linux-android.tar.gz
          curl --fail --location --retry 3 \
            https://files.pythonhosted.org/packages/66/7c/0350cfc47faadc0d3cf7d8237a4e34032b3014ddf4a12ded9933e1648b55/tree-sitter-0.25.2.tar.gz \
            --output binary/downloads/tree-sitter-0.25.2.tar.gz
          echo "38bbe77d3167b5cd554e03b1021324926f09f3825202b065951dd7638e9c37e5  binary/downloads/python-3.14.6-aarch64-linux-android.tar.gz" | sha256sum --check
          echo "e04eb26607627e68d148f89de793372f54a345c91b13628567f24abcdd3bfa3e  binary/downloads/python-3.14.6-x86_64-linux-android.tar.gz" | sha256sum --check
          echo "fe43c158555da46723b28b52e058ad444195afd1db3ca7720c59a254544e9c20  binary/downloads/tree-sitter-0.25.2.tar.gz" | sha256sum --check

      - name: Validate compiler sources on the build host
        run: |
          python -m pip install --upgrade -r requirements.txt
          make ci-build PYTHON=python

      - name: Build self-contained arm64 package
        run: |
          make android-package PYTHON=python
          tar -tzf binary/picoc-compiler-android-arm64.tar.gz | grep 'runtime/lib/libpython3.14.so' >/dev/null
          tar -tzf binary/picoc-compiler-android-arm64.tar.gz | grep 'tree_sitter/_binding.*.so' >/dev/null
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h \
            binary/android-aarch64/picoc-compiler/libexec/picoc_compiler | grep AArch64 >/dev/null
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h \
            binary/android-aarch64/picoc-compiler/app/vendor/tree-sitter-picoc/picoc.so | grep AArch64 >/dev/null

      - name: Cross-check x86-64 package
        run: |
          python scripts/package_android.py \
            --ndk "$ANDROID_NDK_HOME" \
            --arch x86_64 \
            --api 24 \
            --python-runtime binary/downloads/python-3.14.6-x86_64-linux-android.tar.gz \
            --tree-sitter-source binary/downloads/tree-sitter-0.25.2.tar.gz \
            --output binary/picoc-compiler-android-x86_64-smoke.tar.gz

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h binary/android-x86_64/picoc-compiler/libexec/picoc_compiler | grep 'Advanced Micro Devices X86-64' >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: picoc-compiler-android-arm64.tar.gz
          path: binary/picoc-compiler-android-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release for version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
