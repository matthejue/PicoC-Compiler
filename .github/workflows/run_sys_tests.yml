name: Run system tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-tests:
    name: PicoC system tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install compiler dependencies
        run: |
          python -m pip install --upgrade -r requirements.txt
          make ci-build PYTHON=python

      - name: Build RETI Emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          git clone --depth 1 https://github.com/matthejue/Pico-OS.git ../Pico-OS
          git clone --depth 1 https://github.com/matthejue/RETI-Emulator.git ../RETI-Emulator
          make -C ../RETI-Emulator LINUX=1 RELEASE=1
          mkdir -p .ci-bin
          ln -s "$(realpath ../RETI-Emulator/bin/reti_emulator_main)" .ci-bin/reti_emulator
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Run system tests
        env:
          TEST_JOBS: "2"
        run: ./run_sys_tests.sh 120
